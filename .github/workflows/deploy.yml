name: Deploy to Production

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch: # Позволяет запускать вручную

env:
  NODE_VERSION: "22"
  IMAGE_NAME: "testnextjs-app"
  IMAGE_TAG: "latest"

jobs:
  # Фаза 1: Тесты
  test:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type check
        run: yarn type-check

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # Фаза 2: Сборка образа на runner'е
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }} \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }} \
            -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Save image to tar
        run: |
          docker save ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} | gzip > image.tar.gz
          ls -lh image.tar.gz

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        continue-on-error: true
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 600 ~/.ssh/known_hosts

      - name: Copy image to server
        timeout-minutes: 15
        run: |
          echo "Копирование образа на сервер..."
          scp -o StrictHostKeyChecking=no image.tar.gz ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PATH }}/image.tar.gz
          echo "Образ успешно скопирован на сервер"

  # Фаза 3: Распаковка и запуск образа на сервере
  deploy:
    name: Deploy Image to Server
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        continue-on-error: true
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 600 ~/.ssh/known_hosts

      - name: Sync repository with server
        timeout-minutes: 5
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash << EOF
            set -e
            cd ${{ secrets.SERVER_PATH }}

            echo "Синхронизация репозитория с GitHub..."

            # Проверяем, является ли директория git репозиторием
            if [ -d .git ]; then
              echo "Найден существующий git репозиторий"

              # Проверяем текущую ветку
              CURRENT_BRANCH=\$(git branch --show-current 2>/dev/null || echo "master")
              echo "Текущая ветка: \$CURRENT_BRANCH"

              # Получаем имя ветки из GitHub Actions
              TARGET_BRANCH="${{ github.ref_name }}"
              echo "Целевая ветка: \$TARGET_BRANCH"

              # Переключаемся на нужную ветку, если нужно
              if [ "\$CURRENT_BRANCH" != "\$TARGET_BRANCH" ]; then
                echo "Переключение на ветку \$TARGET_BRANCH..."
                set +e
                git fetch origin \$TARGET_BRANCH 2>/dev/null || git fetch origin
                git checkout -B \$TARGET_BRANCH origin/\$TARGET_BRANCH 2>/dev/null || git checkout -b \$TARGET_BRANCH 2>/dev/null || true
                set -e
              fi

              # Обновляем репозиторий
              echo "Выполнение git pull..."
              set +e
              git fetch origin \$TARGET_BRANCH || git fetch origin
              git reset --hard origin/\$TARGET_BRANCH || git reset --hard origin/master || git reset --hard origin/main
              RESET_EXIT=\$?
              set -e

              if [ \$RESET_EXIT -ne 0 ]; then
                echo "Предупреждение: не удалось выполнить reset, пробуем pull..."
                set +e
                git pull origin \$TARGET_BRANCH || git pull origin master || git pull origin main || true
                set -e
              fi

              echo "✓ Репозиторий синхронизирован"
              echo "Текущий коммит: \$(git rev-parse --short HEAD 2>/dev/null || echo 'неизвестно')"
            else
              echo "Директория не является git репозиторием"
              echo "Попытка инициализации репозитория..."

              # Формируем URL репозитория
              REPO_URL="https://github.com/${{ github.repository }}.git"
              echo "URL репозитория: \$REPO_URL"

              # Пытаемся клонировать (может не сработать для приватных репозиториев без токена)
              if [ -z "\$(ls -A . 2>/dev/null)" ]; then
                echo "Директория пуста, клонируем репозиторий..."
                set +e
                git clone -b ${{ github.ref_name }} \$REPO_URL .
                CLONE_EXIT=\$?
                set -e
                if [ \$CLONE_EXIT -ne 0 ]; then
                  echo "Предупреждение: не удалось клонировать репозиторий автоматически"
                  echo "Убедитесь, что репозиторий настроен на сервере вручную"
                fi
              else
                echo "Директория не пуста, инициализируем git..."
                git init
                git remote add origin \$REPO_URL 2>/dev/null || git remote set-url origin \$REPO_URL
                set +e
                git fetch origin ${{ github.ref_name }} || git fetch origin
                git checkout -b ${{ github.ref_name }} origin/${{ github.ref_name }} || true
                CHECKOUT_EXIT=\$?
                set -e
                if [ \$CHECKOUT_EXIT -ne 0 ]; then
                  echo "Предупреждение: не удалось переключиться на ветку"
                  echo "Репозиторий будет синхронизирован при следующем деплое"
                fi
              fi
            fi
          EOF

      - name: Deploy on server
        timeout-minutes: 10
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash << EOF
            set -e
            cd ${{ secrets.SERVER_PATH }}

            echo "Создание .env файла..."
            echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" > .env
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env
            echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env
            echo "VSEGPT_API_KEY=${{ secrets.VSEGPT_API_KEY }}" >> .env
            echo "VSEGPT_MODEL=${{ secrets.VSEGPT_MODEL }}" >> .env

            echo "Загрузка образа из tar..."
            docker load < image.tar.gz

            echo "Проверка загруженного образа..."
            if ! docker images ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} | grep -q ${{ env.IMAGE_NAME }}; then
              echo "ОШИБКА: образ не загружен!"
              exit 1
            fi
            docker images ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

            echo "Образ успешно загружен. Остановка старого контейнера..."
            docker stop nextjs-app 2>/dev/null || true
            docker rm nextjs-app 2>/dev/null || true

            echo "Очистка старых образов (dangling)..."
            docker image prune -f

            echo "Запуск нового контейнера..."
            docker run -d \
              --name nextjs-app \
              --restart unless-stopped \
              -p 3000:3000 \
              --env-file .env \
              ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

            echo "Ожидание запуска контейнера..."
            sleep 5

            echo "Проверка статуса контейнера:"
            docker ps | grep nextjs-app

            echo "Очистка временного файла..."
            rm -f image.tar.gz
          EOF

      - name: Health check
        timeout-minutes: 5
        run: |
          sleep 10
          response=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.SERVER_HOST }}:3000 || echo "000")
          if [ "$response" != "200" ]; then
            echo "Health check failed. Response code: $response"
            exit 1
          fi
          echo "Health check passed!"
